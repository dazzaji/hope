<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="HOPE Lab workshop slides">
    <title>HOPE Lab Slides</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f5f7;
        color: #17202a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 56px;
        padding: 10px clamp(14px, 3vw, 32px);
        border-bottom: 1px solid #d9dde3;
        background: #ffffff;
      }

      h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 650;
        letter-spacing: 0;
      }

      a {
        color: #075c4c;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0;
        text-underline-offset: 3px;
      }

      main {
        min-height: 0;
        background: #202124;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>HOPE Lab Slides</h1>
      <a
        href="https://docs.google.com/presentation/d/1_wubGCMQoCiMPBtLSUIwPvzqj02zYmCjFJKLbcIMv68/edit?usp=sharing"
        target="_blank"
        rel="noopener noreferrer"
      >Open in Google Slides</a>
    </header>
    <main>
      <iframe
        src="https://docs.google.com/presentation/d/1_wubGCMQoCiMPBtLSUIwPvzqj02zYmCjFJKLbcIMv68/embed?start=false&amp;loop=false&amp;delayms=3000"
        title="HOPE Lab presentation"
        allowfullscreen
      ></iframe>
    </main>
  </body>
</html>
